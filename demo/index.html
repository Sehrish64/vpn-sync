<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VPN Pakda Gaya? 🕵️</title>
<style>
  :root{--bg:#0b0f1a;--card:#141a2b;--ok:#2ecc71;--bad:#ff4d6d;--tx:#e8ecf8;--mu:#8b95b3}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;display:flex;justify-content:center;padding:24px}
  main{max-width:460px;width:100%} h1{font-size:26px;margin:0 0 4px} p.s{color:var(--mu);margin:0 0 18px}
  button{background:#5b7cfa;color:#fff;border:0;border-radius:10px;padding:12px 18px;font-size:16px;cursor:pointer;width:100%}
  .row{background:var(--card);border-radius:12px;padding:12px 14px;margin:10px 0;display:flex;gap:10px;align-items:flex-start}
  .row .ic{font-size:20px} .row small{color:var(--mu);display:block}
  .score{background:var(--card);border-radius:16px;padding:18px;text-align:center;margin-top:16px}
  .score b{font-size:42px;display:block}
</style></head>
<body><main>
  <h1>🕵️ VPN Pakda Gaya?</h1>
  <p class="s">VPN on karo, phir button dabao. Sab kuch tumhare browser mein hota hai.</p>
  <button id="go">Check karo</button>
  <div id="rows"></div><div id="score"></div>
<script>
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const offsetOf = (tz, date) => {
  const t = Math.floor(date.getTime()/1000)*1000, o = {};
  for (const x of new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',second:'numeric'}).formatToParts(new Date(t))) o[x.type]=x.value;
  return Math.round((t - Date.UTC(+o.year,+o.month-1,+o.day,+o.hour,+o.minute,+o.second))/60000);
};
async function webrtcIPs(){
  const found = new Set();
  try{
    const pc = new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
    pc.createDataChannel('x');
    pc.onicecandidate = e => {
      const m = e.candidate && e.candidate.candidate.match(/(\d{1,3}(?:\.\d{1,3}){3})/);
      if (m && !/^(10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.|127\.)/.test(m[1])) found.add(m[1]);
    };
    await pc.setLocalDescription(await pc.createOffer());
    await sleep(2500); pc.close();
  }catch(e){}
  return [...found];
}
async function battery(){ try{ if(!navigator.getBattery) return null; const b = await navigator.getBattery(); return b; }catch(e){ return null; } }

$('#go').onclick = async () => {
  $('#rows').innerHTML = ''; $('#score').innerHTML = '';
  $('#go').textContent = 'Detective kaam kar raha hai...';
  let ip;
  try { ip = await (await fetch('https://ipapi.co/json/')).json(); } catch(e) {}
  if (!ip || !ip.timezone){ $('#go').textContent = 'IP lookup fail hua. Dobara try karo.'; return; }
  const now = new Date(), checks = [];

  const tzBrowser = Intl.DateTimeFormat().resolvedOptions().timeZone;
  checks.push({n:'Timezone', bad: tzBrowser !== ip.timezone,
    d:`IP: ${ip.timezone} | Browser: ${tzBrowser}`});

  const offBrowser = now.getTimezoneOffset(), offIP = offsetOf(ip.timezone, now);
  checks.push({n:'Ghari ka offset', bad: offBrowser !== offIP,
    d:`IP: ${-offIP/60}h | Browser: ${-offBrowser/60}h`});

  const lang = navigator.language || '', region = (lang.split('-')[1]||'').toUpperCase();
  checks.push({n:'Language', bad: !!region && region !== ip.country_code,
    d:`Browser: ${lang} | IP country: ${ip.country_code}`});

  const leaks = (await webrtcIPs()).filter(x => x !== ip.ip);
  checks.push({n:'WebRTC leak', bad: leaks.length>0,
    d: leaks.length ? `Asli IP nikli: ${leaks.join(', ')}` : 'Koi leak nahi'});

  const b = await battery();
  checks.push({n:'Battery', bad: !!b && !(b.charging===true && b.level===1) && false,
    d: b ? `Level ${Math.round(b.level*100)}% | ${b.charging?'charging':'discharging'}` : 'Browser battery info nahi deta (achha hai)'});

  $('#rows').innerHTML = checks.map(c => `<div class="row"><span class="ic">${c.bad?'🚨':'✅'}</span><div><b>${c.n}</b><small>${c.d}</small></div></div>`).join('');
  const caught = checks.filter(c=>c.bad).length, total = checks.length;
  const grade = caught===0?'A+':caught===1?'B':caught===2?'C':'F';
  $('#score').innerHTML = `<div class="score"><b>${caught}/${total} se pakda gaya</b>Stealth grade: ${grade}<br><br><button id="cp">Result copy karo</button></div>`;
  $('#cp').onclick = () => { navigator.clipboard.writeText(`Mujhe ${total} mein se ${caught} cheezon se pakda gaya. Stealth grade: ${grade} 🕵️ Tum bhi check karo!`); $('#cp').textContent='Copy ho gaya ✅'; };
  $('#go').textContent = 'Dobara check karo';
};
</script></main></body></html>
